# The .deb, .rpm and Arch package, from one description (nfpm). The release
# workflow sets VERSION and ARCH (amd64, arm64), copies the self-contained
# app published for that architecture to stage/package, then runs:
#   nfpm package -f packaging/linux/nfpm.yaml -p deb|rpm|archlinux -t dist/
# The app goes in /opt/aster with "aster" on the path; it plays with the
# distribution's libmpv. WebKitGTK and GStreamer's good plugins are only
# for trailers (without them they open in the browser), libsecret only for
# keeping sign-ins in the keyring (without it, a file only this user can read).
name: aster
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: video
priority: optional
maintainer: Aster Media Player <support@astermediaplayer.com>
homepage: https://astermediaplayer.com
license: MPL-2.0
description: |
  Watch and listen from Jellyfin, Emby and Plex.
  A media player for your own server, made for the couch: a game controller
  works everywhere, and it runs full screen from Steam. Films, shows, anime,
  music, audiobooks and Live TV; disc menus; TV-style channels; household
  profiles.

contents:
  - src: stage/package
    dst: /opt/aster
    type: tree
  - src: /opt/aster/Aster.Desktop
    dst: /usr/bin/aster
    type: symlink
  - src: packaging/linux/com.astermediaplayer.Aster.desktop
    dst: /usr/share/applications/com.astermediaplayer.Aster.desktop
  - src: packaging/flatpak/com.astermediaplayer.Aster.metainfo.xml
    dst: /usr/share/metainfo/com.astermediaplayer.Aster.metainfo.xml
  - src: packaging/flatpak/icons/64.png
    dst: /usr/share/icons/hicolor/64x64/apps/com.astermediaplayer.Aster.png
  - src: packaging/flatpak/icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/com.astermediaplayer.Aster.png
  - src: packaging/flatpak/icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/com.astermediaplayer.Aster.png
  - src: packaging/flatpak/icons/512.png
    dst: /usr/share/icons/hicolor/512x512/apps/com.astermediaplayer.Aster.png

overrides:
  deb:
    depends:
      - libmpv2
      - libicu78 | libicu77 | libicu76 | libicu74 | libicu72
      - libfontconfig1
    recommends:
      - libwebkit2gtk-4.1-0
      - gstreamer1.0-plugins-good
      - gstreamer1.0-libav
      - libsecret-1-0
  rpm:
    depends:
      # Fedora's mpv-libs, openSUSE's libmpv2.
      - (mpv-libs or libmpv2)
      - libicu
      - fontconfig
    recommends:
      - (webkit2gtk4.1 or libwebkit2gtk-4_1-0)
      - (gstreamer1-plugins-good or gstreamer-plugins-good)
      - libsecret
  archlinux:
    depends:
      - mpv
      - icu
      - fontconfig

deb:
  fields:
    Bugs: https://github.com/AsterMediaPlayer/aster-linux/issues
rpm:
  group: Applications/Multimedia
  summary: Watch and listen from Jellyfin, Emby and Plex
