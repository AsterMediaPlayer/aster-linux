# Aster as a Flatpak. Build and install it here with:
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/com.astermediaplayer.Aster.yml
# The .NET packages come from nuget-sources.json (the build runs offline): after changing
# a package, make it again with flatpak-builder-tools' dotnet/flatpak-dotnet-generator.py.
# libmpv is built here (a Flatpak can't use the system's), from mpv's own Flathub recipe,
# cut down to what Aster plays with: libmpv alone, OpenGL, VA-API, PipeWire and Pulse.
# No WebKitGTK yet: trailers open in the browser.
id: com.astermediaplayer.Aster
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: aster

finish-args:
  - --share=ipc
  # Avalonia draws on X11 (XWayland on a Wayland desktop), and gamescope is X11.
  - --socket=x11
  - --socket=pulseaudio
  # The server, and Sonos speakers found on the network.
  - --share=network
  # The GPU, and game controllers (SDL reads them from /dev/input and /dev/hidraw).
  - --device=all
  # Sign-ins and the MDBList key, kept with the Secret Service.
  - --talk-name=org.freedesktop.secrets
  # The system's media controls.
  - --own-name=org.mpris.MediaPlayer2.aster

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: libass
    config-opts:
      - --disable-static
      - --enable-asm
      - --enable-harfbuzz
      - --enable-fontconfig
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  - name: zimg
    config-opts:
      - --disable-static
    sources:
      - type: archive
        archive-type: tar
        url: https://api.github.com/repos/sekrit-twc/zimg/tarball/release-3.0.6
        sha256: 15140e491c4ce9db5f02a038d8a1eb53e9151b55eeed06a2899425a6ebfef367

  # Decoding only: Aster plays what the server sends, and never records.
  - name: ffmpeg
    config-opts:
      - --disable-debug
      - --disable-doc
      - --disable-static
      - --disable-programs
      - --disable-encoders
      - --enable-shared
      - --enable-gpl
      - --enable-version3
      - --enable-gnutls
      - --enable-libdav1d
      - --enable-libopus
      - --enable-libvorbis
      - --enable-libvpx
      - --enable-libxml2
      - --enable-libdrm
      - --enable-vaapi
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dopengl=enabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  # mpv's X11 output wants it; the runtime hasn't it.
  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
        tag: libXpresent-1.0.2
        commit: 4d92149372461bf575e8a09b1064a2884c38c3aa

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dwerror=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dgl=enabled
      - -Dgl-x11=enabled
      - -Degl=enabled
      - -Degl-x11=enabled
      - -Dx11=enabled
      - -Dwayland=disabled
      - -Dvulkan=disabled
      - -Ddrm=disabled
      - -Dvaapi=enabled
      - -Dvaapi-x11=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dalsa=enabled
      - -Diconv=enabled
      - -Dlcms2=enabled
      - -Duchardet=enabled
      - -Dzimg=enabled
      - -Dzlib=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.42.0
        commit: b0841e8c4d156b8403dc1876c4cbd9011eb583f3

  - name: aster
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
        DOTNET_NOLOGO: 'true'
    build-commands:
      - dotnet publish src/Aster.Desktop/Aster.Desktop.csproj -c Release -r linux-x64 --self-contained
        --source ./nuget-sources -p:DebugType=none -o /app/lib/aster
      - install -Dm755 packaging/flatpak/aster.sh /app/bin/aster
      - install -Dm644 packaging/flatpak/com.astermediaplayer.Aster.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/com.astermediaplayer.Aster.metainfo.xml -t /app/share/metainfo
      - for size in 64 128 256 512; do install -Dm644 packaging/flatpak/icons/$size.png
        /app/share/icons/hicolor/${size}x${size}/apps/com.astermediaplayer.Aster.png; done
    sources:
      # This checkout, without what a build here left behind.
      - type: dir
        path: ../..
        skip:
          - .git
          - build-dir
          - .flatpak-builder
          - src/Aster.Core/bin
          - src/Aster.Core/obj
          - src/Aster.Mpv/bin
          - src/Aster.Mpv/obj
          - src/Aster.Desktop/bin
          - src/Aster.Desktop/obj
          - tests
      - nuget-sources.json
